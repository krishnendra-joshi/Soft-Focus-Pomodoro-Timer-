<style>
:root{--ink:#403b39;--paper:#fffaf1;--glass:rgba(255,250,241,.83)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#d9e7e3}
.scene{position:fixed;inset:0;z-index:-2;overflow:hidden;transition:background 1s}
.scene:before,.scene:after{content:"";position:absolute;inset:0;pointer-events:none}
.scene:after{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(38,40,44,.12))}
/* Realistic city-life photo wallpapers; timer card layout stays unchanged. */
.scene.cityday{background:linear-gradient(180deg,rgba(20,30,42,.08),rgba(20,30,42,.18)),url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=2200&q=85') center/cover no-repeat}
.scene.cityrain{background:linear-gradient(180deg,rgba(17,31,45,.16),rgba(17,31,45,.30)),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2200&q=85') center/cover no-repeat}
.scene.cityevening{background:linear-gradient(180deg,rgba(24,24,38,.10),rgba(24,24,38,.32)),url('https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=2200&q=85') center/cover no-repeat}
.scene.citystreet{background:linear-gradient(180deg,rgba(24,30,36,.10),rgba(24,30,36,.30)),url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=2200&q=85') center/cover no-repeat}
.sun,.hill,.decor,.rainlines{display:none}
.wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.panel{width:min(570px,94vw);text-align:center;background:var(--glass);backdrop-filter:blur(14px);border:1px solid #ffffffa8;border-radius:30px;padding:30px 34px 26px;box-shadow:0 24px 70px #273a3630;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.brand{font-weight:800}.menuBtn{border:0;background:#fff9;border-radius:12px;padding:10px 13px;color:var(--ink);font-size:20px;cursor:pointer}
h1{font-size:clamp(25px,5vw,38px);margin:18px 0 2px}.subtitle{font-size:13px;opacity:.72}
.mode{display:flex;justify-content:center;gap:8px;margin:22px 0 8px}
.mode button,.controls button,.settings button{border:1px solid #8b7b7040;background:#fff9;color:var(--ink);border-radius:13px;padding:10px 14px;cursor:pointer;font:inherit}
.mode button.active,.primary{background:#514943!important;color:#fff!important;border-color:#514943!important}
.clock{font-variant-numeric:tabular-nums;font-weight:750;font-size:clamp(74px,16vw,112px);letter-spacing:-.065em;line-height:1.1;margin:12px 0}

.controls{display:flex;justify-content:center;gap:10px}.controls button{min-width:100px;padding:12px 18px}
.note{font-size:12px;opacity:.65;margin-top:18px}
.settings{display:none;position:absolute;z-index:5;right:18px;top:58px;width:min(330px,calc(100vw - 38px));max-height:72vh;overflow:auto;text-align:left;background:#fffaf4;border:1px solid #cfc2b4;border-radius:18px;padding:17px;box-shadow:0 16px 40px #29201e35}
.settings.open{display:block}.settings h3{margin:3px 0 14px}.settings label{display:block;font-size:13px;margin:12px 0 5px}.settings input,.settings select{width:100%;padding:10px 12px;border:1px solid #c9b9a7;border-radius:11px;background:linear-gradient(145deg,#fffdf8,#f3eadc);color:#403b39;font:inherit;box-shadow:inset 0 1px 2px #5b46300d;accent-color:#718d79;color-scheme:light;transition:border-color .18s,box-shadow .18s}
.settings select{cursor:pointer}
.settings select:focus,.settings input:focus{outline:none;border-color:#718d79;box-shadow:0 0 0 3px #718d7930}
.settings select option{background:#fffaf1;color:#403b39;padding:8px}

@media(max-width:500px){.panel{padding:23px 18px}.clock{font-size:76px}.mode button{padding:9px 10px;font-size:13px}.controls button{min-width:0;flex:1}}
/* Responsive layout: compact phones, tablets, desktops, and large displays. */
html{min-height:100%;-webkit-text-size-adjust:100%;}
body{overflow-x:hidden;overflow-y:auto;min-height:100dvh;}
.wrap{min-height:100dvh;height:auto;padding:clamp(12px,3vw,32px);}
.panel{width:min(100%,570px);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;}
button,select,input{touch-action:manipulation;}
button{min-height:42px;}
@media(max-width:600px){
  .wrap{align-items:flex-start;padding:12px;}
  .panel{margin:auto 0;border-radius:22px;padding:clamp(18px,5vw,25px) clamp(14px,4vw,20px);max-height:none;}
  .top{font-size:12px;}
  .mode{gap:6px;margin:18px 0 8px;}
  .mode button{flex:1;min-width:0;padding:10px 5px;font-size:clamp(12px,3.4vw,14px);}
  .clock{font-size:clamp(64px,19vw,92px);margin:12px 0;}
  .controls{gap:8px;}
  .controls button{flex:1;min-width:0;padding:12px 10px;}
  .gamesBtn{width:100%;}
  .settings{position:fixed;top:12px;right:12px;left:12px;width:auto;max-height:calc(100dvh - 24px);}
  .settingrow{gap:7px;}
  .settingrow>div{min-width:0;}
  .settingrow input{min-width:0;}
  .gameOverlay{padding:10px;}
  .gameBox{width:100%;max-width:440px;max-height:calc(100dvh - 20px);padding:15px;}
  .gameChoices{gap:6px;}
  .gameChoices button{font-size:13px;padding:10px 5px;}
  .targetArea{height:clamp(160px,42vh,250px);}
}
@media(max-width:360px){
  .settingrow{flex-wrap:wrap;}
  .settingrow>div{flex:1 1 42%;}
  .clock{font-size:64px;}
  .gameChoices{grid-template-columns:1fr 1fr;}
  .ttt{grid-template-columns:repeat(3,minmax(0,68px));}
  .ttt button{height:68px;}
  .memory{grid-template-columns:repeat(4,minmax(0,54px));}
  .memory button{height:54px;}
}
@media(min-width:700px){
  .panel{width:min(570px,92vw);}
  .settings{max-height:min(72vh,700px);}
}
@media(min-width:1200px){
  .panel{width:min(620px,88vw);padding:36px 42px 30px;}
  .clock{font-size:clamp(112px,8vw,138px);}
  .gamesBtn{margin-top:18px;}
}
@media(min-width:1800px){
  .panel{width:min(700px,70vw);padding:44px 52px 38px;border-radius:34px;}
  h1{font-size:42px;}
  .clock{font-size:150px;}
  .subtitle,.note{font-size:15px;}
  .mode button,.controls button,.gamesBtn{font-size:17px;padding:14px 20px;}
}
@media(max-height:520px) and (orientation:landscape){
  .wrap{padding:10px;}
  .panel{padding:14px 22px;max-height:calc(100dvh - 20px);}
  h1{margin:8px 0 0;font-size:25px;}
  .mode{margin:10px 0 4px;}
  .clock{font-size:clamp(52px,14vh,76px);margin:4px 0;}
  .progress{margin:6px 0 10px;}
  .note{margin-top:8px;}
  .gamesBtn{margin-top:8px;}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important;}}

<body>
<div class="scene cityday" id="scene"></div>
<div class="wrap"><main class="panel">
<div class="top"><span class="brand">✦ Soft Focus</span><button class="menuBtn" id="menuBtn" aria-label="Settings">⋯</button></div>
<h1 id="heading">A little focus time</h1><div class="subtitle" id="wallLabel">City life · daylight</div>
<div class="mode"><button class="active" data-mode="focus">Focus</button><button data-mode="short">Short break</button><button data-mode="long">Long break</button></div>
<div class="clock" id="clock">25:00</div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="controls"><button class="primary" id="start">Start</button><button id="reset">Reset</button></div>
<div class="note">A quiet little space for doing one thing at a time.</div><button class="gamesBtn" id="openGames">Mini games · quick break</button>
<div class="settings" id="settings">
<h3>Settings <span style="float:right;cursor:pointer" id="close">×</span></h3>
<div class="settingrow"><div><label for="focusM">Focus (min)</label><input id="focusM" type="number" min="1" max="180" value="25"></div><div><label for="shortM">Short break</label><input id="shortM" type="number" min="1" max="60" value="5"></div><div><label for="longM">Long break</label><input id="longM" type="number" min="1" max="90" value="15"></div></div>
<label for="wallpaper">City wallpaper</label><select id="wallpaper"><option value="cityday">City skyline · daylight</option><option value="cityrain">Rainy city · moody streets</option><option value="cityevening">City lights · evening</option><option value="citystreet">Urban atmosphere · overcast</option></select>
<label for="ambience">Ambient sound</label><select id="ambience"><option value="none">Off</option><option value="brown">Brown noise</option></select>
<label for="volume">Ambient volume</label><input id="volume" type="range" min="0" max="100" value="22">
<label><input type="checkbox" id="auto" checked style="width:auto"> Auto-start next session</label>
<p class="small">Browser audio starts after a button press.</p>
</div>
<div hidden><select id="music"><option value="mozart">Mozart</option></select><button id="playMusic">Play music</button><button id="stopMusic">Stop music</button></div>
</main></div>
<div class="gameOverlay" id="gameOverlay"><section class="gameBox"><div class="gameTop"><strong>Quick-break mini games</strong><button id="closeGames" aria-label="Close games">✕</button></div><div class="gameChoices" role="group" aria-label="Choose a mini game"><button type="button" data-game="ttt" class="active">Tic-tac-toe</button><button type="button" data-game="memory">Memory Match</button><button type="button" data-game="target">Tap the Target</button><button type="button" data-game="guess">Number Guess</button></div><div id="gameArea"></div></section></div>
<div class="alert" id="alert"><div class="alertbox"><h2 id="alertTitle">Time's up</h2><p id="alertText">Take a breath and reset.</p><button class="primary" id="dismiss">Turn off bell</button></div></div>
<script>
const $=id=>document.getElementById(id);
let mode='focus',remaining=1500,total=1500,interval=null,started=false,ctx=null,ambNodes=[],musicNodes=[],musicTimer=null,bellTimer=null,ambienceTimer=null,ambienceGain=null;
const durations=()=>({focus:Math.max(1,+$('focusM').value||25)*60,short:Math.max(1,+$('shortM').value||5)*60,long:Math.max(1,+$('longM').value||15)*60});
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function render(){let m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('bar').style.width=(100*(1-remaining/total))+'%';document.title=$('clock').textContent+' · Soft Focus'}
function setMode(m){mode=m;remaining=total=durations()[m];document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('heading').textContent=m==='focus'?'A little focus time':m==='short'?'A small pause':'A longer pause';stopTimer();render()}
function stopTimer(){clearInterval(interval);interval=null;started=false;$('start').textContent='Start';stopAmbience()}
function startTimer(){if(started)return;audio();started=true;$('start').textContent='Pause';startAmbience();interval=setInterval(()=>{remaining--;if(mode==='focus'&&remaining===600)ringBell('10 minutes left','You have ten minutes remaining in this focus session.');if(remaining<=0){remaining=0;render();stopTimer();ringBell('Session complete',mode==='focus'?'Focus session complete. Time for a break.':'Break complete. Ready when you are.');if($('auto').checked)setTimeout(()=>{let next=mode==='focus'?'short':'focus';setMode(next);startTimer()},1200);return}render()},1000)}
function reset(){stopTimer();remaining=total=durations()[mode];render()}
$('start').onclick=()=>started?stopTimer():startTimer();$('reset').onclick=reset;

document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('menuBtn').onclick=()=>$('settings').classList.toggle('open');$('close').onclick=()=>$('settings').classList.remove('open');
['focusM','shortM','longM'].forEach(id=>$(id).onchange=()=>{if(!started)reset()});
const walls={cityday:'City life · daylight',cityrain:'Rainy city · moody streets',cityevening:'City lights · evening',citystreet:'Urban atmosphere · overcast'};
$('wallpaper').onchange=()=>{let v=$('wallpaper').value;$('scene').className='scene '+v;$('wallLabel').textContent=walls[v];};
function stopAmbience(){
  clearTimeout(ambienceTimer);clearInterval(ambienceTimer);ambienceTimer=null;
  ambNodes.forEach(n=>{try{n.stop?.();n.disconnect?.()}catch(e){}});
  ambNodes=[];ambienceGain=null;
}
function startAmbience(){
  stopAmbience();let type=$('ambience').value;if(type==='none')return;
  let c=audio(),master=c.createGain();master.gain.value=(+$('volume').value/100)*.72;master.connect(c.destination);ambienceGain=master;
  function noiseBuffer(seconds=1){let b=c.createBuffer(1,Math.floor(c.sampleRate*seconds),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
  function noiseHit({duration=.1,level=.08,low=500,high=5000,pan=0,attack=.004}={}){
    let t=c.currentTime,src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),p=c.createStereoPanner();
    src.buffer=noiseBuffer(Math.max(.12,duration));f.type='bandpass';f.frequency.value=(low+high)/2;f.Q.value=Math.max(.15,(low+high)/(high-low));
    p.pan.value=pan;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    src.connect(f).connect(g).connect(p).connect(master);src.start(t);src.stop(t+duration+.02);ambNodes.push(src,f,g,p);
  }
  if(type==='brown'||type==='white'){
    let src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=noiseBuffer(3);src.loop=true;
    f.type=type==='brown'?'lowpass':'highpass';f.frequency.value=type==='brown'?190:5500;g.gain.value=.3;src.connect(f).connect(g).connect(master);src.start();ambNodes.push(src,f,g);
  }else if(type==='rain'){
    // No pitched oscillators or sustained noise bed: only irregular broadband droplets,
    // leaf ticks, and soft diffuse splash noise.
    function rainDrops(){
      if(!ambienceGain)return;
      let n=3+Math.floor(Math.random()*6);
      for(let i=0;i<n;i++){
        let leaf=Math.random()<.63,drop=Math.random()<.13;
        if(leaf){
          noiseHit({duration:.018+Math.random()*.055,level:drop?.09+Math.random()*.08:.025+Math.random()*.045,
            low:1900+Math.random()*900,high:5200+Math.random()*1800,pan:Math.random()*2-1,attack:.002});
          if(Math.random()<.3)noiseHit({duration:.05+Math.random()*.1,level:.018+Math.random()*.035,low:650,high:1700,pan:Math.random()*2-1,attack:.008});
        }else{
          noiseHit({duration:.045+Math.random()*.15,level:drop?.08+Math.random()*.07:.025+Math.random()*.05,
            low:250+Math.random()*500,high:1300+Math.random()*700,pan:Math.random()*2-1,attack:.006});
        }
      }
      ambienceTimer=setTimeout(rainDrops,75+Math.random()*190);
    }
    rainDrops();
  }else if(type==='forest'){
    // No continuous drone. Short, spatially scattered wildlife-like events with silence between them.
    function chirp({freq=2300,pan=0,dur=.12,level=.035,contour=1.2}={}){
      let t=c.currentTime,o=c.createOscillator(),g=c.createGain(),p=c.createStereoPanner();
      o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*contour,t+dur*.55);
      o.frequency.exponentialRampToValueAtTime(freq*.92,t+dur);
      p.pan.value=pan;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(level,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(p).connect(master);o.start(t);o.stop(t+dur+.02);ambNodes.push(o,g,p);
    }
    function insectPulse(){
      // Insect texture is a rapid series of very short filtered-noise clicks, not a sustained tone.
      let count=4+Math.floor(Math.random()*9),delay=23+Math.random()*22;
      for(let i=0;i<count;i++)setTimeout(()=>noiseHit({duration:.012+Math.random()*.012,level:.009+Math.random()*.012,low:4200,high:8500,pan:Math.random()*2-1,attack:.002}),i*delay);
    }
    function wildlife(){
      if(!ambienceGain)return;
      let r=Math.random();
      if(r<.58){
        let n=2+Math.floor(Math.random()*4);
        for(let i=0;i<n;i++)setTimeout(()=>chirp({freq:1450+Math.random()*2700,pan:Math.random()*2-1,dur:.07+Math.random()*.17,level:.018+Math.random()*.03,contour:.78+Math.random()*.65}),i*(95+Math.random()*180));
      }else if(r<.8){
        let n=4+Math.floor(Math.random()*8);
        for(let i=0;i<n;i++)setTimeout(()=>chirp({freq:2400+Math.random()*1800,pan:Math.random()*2-1,dur:.025+Math.random()*.05,level:.012+Math.random()*.018,contour:.7+Math.random()*.7}),i*(38+Math.random()*60));
      }else insectPulse();
      ambienceTimer=setTimeout(wildlife,550+Math.random()*1650);
    }
    wildlife();
    // Occasional sparse insect bursts, never a continuous buzzing layer.
    let insectId=setInterval(insectPulse,3600+Math.random()*2500);
    ambNodes.push({stop:()=>clearInterval(insectId),disconnect:()=>{}});
  }
}
$('ambience').onchange=()=>{if(started)startAmbience()};$('volume').oninput=()=>{if(ambienceGain)ambienceGain.gain.value=(+$('volume').value/100)*.72};
function ringBell(title,msg){stopBell();$('alertTitle').textContent=title;$('alertText').textContent=msg;$('alert').classList.add('show');playBell();bellTimer=setInterval(playBell,1700)}
function playBell(){let c=audio(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(660,c.currentTime+.45);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.17,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.8);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.82)}
function stopBell(){clearInterval(bellTimer);bellTimer=null;$('alert').classList.remove('show')}
$('dismiss').onclick=stopBell;
const pieces={
mozart:{tempo:390,mel:[72,76,79,84,83,84,79,76,74,77,81,86,84,81,79,76,72,74,76,79,77,76,74,72],bass:[48,55,53,60,48,55,50,57],chords:[[0,4,7],[5,9,12],[7,11,14],[0,4,7]],rhythm:[1,1,.65,.65,1,.65,.65,1],wave:'triangle'},
beethoven:{tempo:520,mel:[60,60,67,65,64,62,60,55,60,64,67,72,71,69,67,65,64,64,71,69,67,65,64,60],bass:[36,43,36,43,38,45,38,45],chords:[[0,7,12],[0,7,12],[5,9,12],[7,11,14]],rhythm:[.48,.48,1,.48,.48,1,.7,.7],wave:'triangle'},

function stopMusic(){clearInterval(musicTimer);musicTimer=null;musicNodes.forEach(n=>{try{n.stop();n.disconnect()}catch(e){}});musicNodes=[];$('playMusic').textContent='Play music'}
function pianoNote(midi,when,duration,velocity=.7,wave='triangle'){
  let c=audio(),fund=440*Math.pow(2,(midi-69)/12),out=c.createGain(),t=when;
  out.gain.setValueAtTime(.0001,t);out.gain.linearRampToValueAtTime(.14*velocity,t+.012);out.gain.exponentialRampToValueAtTime(.045*velocity,t+.19);out.gain.setTargetAtTime(.0001,t+Math.max(.16,duration*.45),.38);out.connect(c.destination);
  [1,2.01,3.98,6.02].forEach((ratio,i)=>{let o=c.createOscillator(),g=c.createGain();o.type=i===0?wave:'sine';o.frequency.value=fund*ratio;g.gain.value=[.7,.19,.065,.018][i];o.connect(g).connect(out);o.start(t);o.stop(t+duration+1);musicNodes.push(o,g)});
  // short broadband hammer transient, avoiding a sharp electronic pip
  let b=c.createBuffer(1,Math.floor(c.sampleRate*.025),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  let src=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();src.buffer=b;filter.type='lowpass';filter.frequency.value=3600;g.gain.value=.035*velocity;src.connect(filter).connect(g).connect(out);src.start(t);musicNodes.push(src,filter,g,out);
}
function playMusic(){
  stopMusic();let c=audio(),piece=pieces[$('music').value],step=0,beat=0,end=Date.now()+210000;
  $('playMusic').textContent='Playing…';
  function tick(){
    if(Date.now()>end){stopMusic();return}
    let t=c.currentTime+.025,idx=step%piece.mel.length;
    let duration=piece.tempo/1000;
    pianoNote(piece.mel[idx],t,duration*.92,idx%6===0?.9:.58,piece.wave);
    // Each piece has its own bass motion, chord voicing and rhythmic pattern.
    if(step%2===0){
      let bass=piece.bass[(step/2)%piece.bass.length];
      pianoNote(bass,t,duration*1.75,.34,piece.wave);
      let chord=piece.chords[Math.floor(step/2)%piece.chords.length];
      chord.forEach((interval,j)=>pianoNote(bass+12+interval,t+j*.035,duration*1.4,.18,piece.wave));
    }
    step++;beat++;
  }
  tick();musicTimer=setInterval(tick,piece.tempo);
}
